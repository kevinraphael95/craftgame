<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Craft</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR GAUCHE : inventaire scrollable -->
<aside id="sidebar">

  <div class="sb-header">
    <div class="logo">
      <span>⚛️</span>
      <div>
        <strong>Quantum Craft</strong>
        <em>Des quarks à l'Univers</em>
      </div>
    </div>
    <div class="sb-stats">
      <b id="nd">10</b> / <b id="nt">?</b> éléments &nbsp;·&nbsp; <b id="fc">0</b> fusions
    </div>
    <div class="sb-progress"><div id="prog-bar"></div></div>
    <div class="sb-search">
      <span>🔍</span>
      <input id="srch" type="text" placeholder="Rechercher..." oninput="renderSidebar()" autocomplete="off">
    </div>
    <div class="sb-filters" id="filters">
      <button class="filt on" data-f="all"      onclick="setFilt(this)">Tout</button>
      <button class="filt"    data-f="quark"     onclick="setFilt(this)">Quarks</button>
      <button class="filt"    data-f="lepton"    onclick="setFilt(this)">Leptons</button>
      <button class="filt"    data-f="boson"     onclick="setFilt(this)">Bosons</button>
      <button class="filt"    data-f="hadron"    onclick="setFilt(this)">Hadrons</button>
      <button class="filt"    data-f="nucleus"   onclick="setFilt(this)">Noyaux</button>
      <button class="filt"    data-f="atom"      onclick="setFilt(this)">Atomes</button>
      <button class="filt"    data-f="molecule"  onclick="setFilt(this)">Molécules</button>
      <button class="filt"    data-f="phase"     onclick="setFilt(this)">Phases</button>
      <button class="filt"    data-f="stellar"   onclick="setFilt(this)">Stellaire</button>
      <button class="filt"    data-f="cosmic"    onclick="setFilt(this)">Cosmique</button>
    </div>
  </div>

  <!-- Liste des éléments découverts -->
  <div id="el-list"></div>

  <div class="sb-footer">
    <button onclick="resetGame()">↺ Réinitialiser</button>
  </div>

</aside>

<!-- CANVAS DROIT : zone de jeu -->
<main id="canvas">

  <!-- Hint quand le canvas est vide -->
  <div id="canvas-hint">
    <div class="ch-icon">⚗️</div>
    <p>Clique sur deux éléments<br>pour les fusionner</p>
  </div>

  <!-- Barre de fusion fixée en bas -->
  <div id="fusion-bar">

    <div class="fslot" id="slot-a">
      <div class="fslot-empty" id="sa-empty">Slot 1</div>
      <div class="fslot-content" id="sa-content" style="display:none">
        <span id="sa-emoji"></span>
        <span id="sa-name"></span>
        <button onclick="clearSlot('a')">✕</button>
      </div>
    </div>

    <div class="fbar-center">
      <div class="fbar-plus">+</div>
      <button id="btn-fuse" onclick="doFuse()" disabled>
        <span>⚡</span> Fusionner
      </button>
    </div>

    <div class="fslot" id="slot-b">
      <div class="fslot-empty" id="sb-empty">Slot 2</div>
      <div class="fslot-content" id="sb-content" style="display:none">
        <span id="sb-emoji"></span>
        <span id="sb-name"></span>
        <button onclick="clearSlot('b')">✕</button>
      </div>
    </div>

  </div>
</main>

<!-- MODAL nouvelle découverte -->
<div id="modal" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div id="modal-new-badge">✨ Nouveau !</div>
    <div id="m-emoji"></div>
    <h2 id="m-name"></h2>
    <div id="m-cat"></div>
    <div id="m-eq"></div>
    <p id="m-desc"></p>
    <button onclick="closeModal()">Continuer →</button>
  </div>
</div>

<!-- TOAST erreur / info -->
<div id="toast"></div>

<script src="craftgame.js"></script>
</body>
</html>
