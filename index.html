<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CRAFT GAME</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Fond quantique -->
<div id="quantum-bg"></div>

<aside id="sidebar">
  <div class="sb-header">
    <div class="logo">
      <span style="font-size:2rem">⚗️</span>
      <div>
        <strong>CRAFT GAME</strong>
                <em>CRAFTER DES TRUCS AVEC DES TRUCS</em>
              </div>
              <div class="logo-right">
                <button id="theme-btn">🌙</button>
              </div>
            </div>
    <div class="sb-stats">
      <b id="nd">11</b> / <b id="nt">?</b> éléments &nbsp;·&nbsp; <b id="fc">0</b> fusions
    </div>
    <div class="sb-progress"><div id="prog-bar"></div></div>
    <div class="sb-search">
      <span>⌕</span>
      <input id="srch" type="text" placeholder="Rechercher..." oninput="renderSidebar()" autocomplete="off">
    </div>
    <div class="sb-filters">
      <button class="filt on" data-f="all"      onclick="setFilt(this)">Tout</button>
      <button class="filt"    data-f="quark"     onclick="setFilt(this)">Quarks</button>
      <button class="filt"    data-f="lepton"    onclick="setFilt(this)">Leptons</button>
      <button class="filt"    data-f="boson"     onclick="setFilt(this)">Bosons</button>
      <button class="filt"    data-f="hadron"    onclick="setFilt(this)">Hadrons</button>
      <button class="filt"    data-f="nucleus"   onclick="setFilt(this)">Noyaux</button>
      <button class="filt"    data-f="atom"      onclick="setFilt(this)">Atomes</button>
      <button class="filt"    data-f="molecule"  onclick="setFilt(this)">Molécules</button>
      <button class="filt"    data-f="phase"     onclick="setFilt(this)">Phases</button>
      <button class="filt"    data-f="stellar"   onclick="setFilt(this)">Stellaire</button>
      <button class="filt"    data-f="cosmic"    onclick="setFilt(this)">Cosmique</button>
    </div>
  </div>

  <div id="el-list"></div>

  <div class="sb-footer">
    <button class="clear-btn" onclick="clearCanvas()">⊘ Vider</button>
    <button onclick="resetGame()">↺ Réinitialiser</button>
  </div>
</aside>

<main id="canvas">
  <div id="canvas-area">
    <div id="canvas-hint">
      <div class="ch-icon">⚗️</div>
      <p>
        Clique sur un élément pour le poser<br>
        Glisse-le sur un autre pour fusionner<br>
        Double-clic pour dupliquer<br>
        Clic droit ou glisser vers ← pour supprimer<br>
        <span style="color:#f87171;font-size:.7em">Particule + antiparticule = ANNIHILATION</span>
      </p>
    </div>
  </div>
</main>

<!-- Modal découverte -->
<div id="modal" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div id="modal-new-badge">✦ Nouveau !</div>
    <div id="m-emoji"></div>
    <h2 id="m-name"></h2>
    <div id="m-cat"></div>
    <div id="m-eq"></div>
    <p id="m-desc"></p>
    <button onclick="closeModal()">Continuer →</button>
  </div>
</div>

<div id="toast"></div>

<script src="data.js"></script>
<script src="craftgame.js"></script>
<div id="bottom-panel">
  <div class="bp-search">
    <span>⌕</span>
    <input id="srch-mobile" type="text" placeholder="Rechercher..." autocomplete="off">
  </div>
  <div class="bp-filters">
    <button class="filt on" data-f="all"      onclick="setFiltMobile(this)">Tout</button>
    <button class="filt"    data-f="quark"     onclick="setFiltMobile(this)">Quarks</button>
    <button class="filt"    data-f="lepton"    onclick="setFiltMobile(this)">Leptons</button>
    <button class="filt"    data-f="boson"     onclick="setFiltMobile(this)">Bosons</button>
    <button class="filt"    data-f="hadron"    onclick="setFiltMobile(this)">Hadrons</button>
    <button class="filt"    data-f="nucleus"   onclick="setFiltMobile(this)">Noyaux</button>
    <button class="filt"    data-f="atom"      onclick="setFiltMobile(this)">Atomes</button>
    <button class="filt"    data-f="molecule"  onclick="setFiltMobile(this)">Molécules</button>
    <button class="filt"    data-f="phase"     onclick="setFiltMobile(this)">Phases</button>
    <button class="filt"    data-f="stellar"   onclick="setFiltMobile(this)">Stellaire</button>
    <button class="filt"    data-f="cosmic"    onclick="setFiltMobile(this)">Cosmique</button>
  </div>
  <div class="bp-list" id="el-list-mobile"></div>
  <div class="bp-footer">
    <button onclick="clearCanvas()">⊘ Vider</button>
    <button onclick="resetGame()">↺ Réinitialiser</button>
  </div>
</div>
</body>
</html>
